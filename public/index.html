    <script>
        function randomString() {
            var chars = "ABCDEFGHIJKLMNOPQRSTUVWXTZabcdefghiklmnopqrstuvwxyz";
            var string_length = 1;
            var randomstring = '';
            for (var i = 0; i < string_length; i++) {
                var rnum = Math.floor(Math.random() * chars.length);
                randomstring += chars.substring(rnum, rnum + 1);
            }
            return randomstring;
        }

        function randomNumber() {
            var d = new Date();
            var randStr = randomString() + d.getMilliseconds() + d.getSeconds() + d.getMinutes() + d.getDate() + (parseInt(d.getMonth()) + 1) + randomString();
            return randStr;
        }
        
    </script>
    <script>
        // Function to retrieve cookie value:	
        function getCookie(cname) {
            var name = cname + "=";
            var ca = document.cookie.split(';');
            for (var i = 0; i < ca.length; i++) {
                var c = ca[i];
                while (c.charAt(0) == ' ') {
                    c = c.substring(1);
                }
                if (c.indexOf(name) == 0) {
                    return c.substring(name.length, c.length);
                }
            }
            return "";
        }

        // To get adobe_ id cookie value:
        var len = document.cookie.split(";").length;
        var arr = document.cookie.split(";");
        for (i = 0; i < len; i++) {
            if (arr[i].indexOf("AMCV") != -1) {
                var res = arr[i];
                if (res.split("AMCV_")[1] != undefined) {
                    var out = decodeURIComponent(res.split("AMCV_")[1].split("=")[0]);
                    var adobe_id = out.split("@")[0];
                } else if (res.split("AMCVS_")[1] != undefined) {
                    var out = decodeURIComponent(res.split("AMCVS_")[1].split("=")[0]);
                    var adobe_id = out.split("@")[0];
                }
            }
        }


        // To get audience_ id cookie value:
        var amcv = getCookie("AMCV_" + encodeURIComponent(out));
        if (decodeURIComponent(amcv).split("MCMID|")[1] != undefined) {
            var audience_id = decodeURIComponent(amcv).split("MCMID|")[1].split("|")[0];
        }

    </script>
